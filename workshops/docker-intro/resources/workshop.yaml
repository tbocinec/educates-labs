apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "docker-intro"
spec:
  title: "Úvod do Dockeru"
  description: "Komplexný praktický workshop pokrývajúci základy Dockeru — sťahovanie images, spúšťanie containers, vykonávanie príkazov vo vnútri containers, správu životného cyklu containera, prezeranie logov, prácu s environment variables a skúmanie Docker images."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/docker-intro-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/docker-intro-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /README.md
      
  session:
    namespaces:
      budget: large
    resources:
      memory: 1536Mi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 2Gi
      registry:
        enabled: false
      vcluster:
        enabled: false
