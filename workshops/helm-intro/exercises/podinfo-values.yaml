# =============================================================
# podinfo-values.yaml — prebitia pre chart podinfo
# =============================================================
# Každý kľúč tu existuje aj vo values.yaml samotného chartu.
# Overte si to sami cez:
#
#     helm show values podinfo/podinfo
#
# Čokoľvek, čo tu nie je uvedené, ostáva na predvolenej hodnote
# chartu. Presne o tom je values súbor: popisuje len to, čo sa
# líši.
#
# Aplikujete ho cez:
#     helm upgrade my-app podinfo/podinfo -f ~/exercises/podinfo-values.yaml
#
# Docs: https://helm.sh/docs/chart_template_guide/values_files/
# =============================================================

replicaCount: 2

# Správa, ktorú aplikácia vracia späť — šikovný spôsob, ako
# dokázať, že vaše values naozaj dorazili do bežiaceho containera.
ui:
  message: "Hello from the Helm workshop!"

# Držte sa pohodlne v rámci kvóty namespace. Bez limitov by sa
# uplatnili predvolené hodnoty z LimitRange namespace.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

# Chart vie vytvoriť aj Ingress. Tu je vypnutý, lebo potrebuje
# hostname a nastavenie TLS, ktoré sa klaster od klastra líšia.
ingress:
  enabled: false

# Autoscaling potrebuje metrics-server. Vypnutý, nech sa chart
# správa rovnako v každom klastri.
autoscaling:
  enabled: false
