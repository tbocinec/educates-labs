# =============================================================
# hello-app-values.yaml — values pre chart, ktorý ste vygenerovali
# =============================================================
# "helm create" vygeneruje chart, ktorý spúšťa nginx. Tieto values
# ho nasmerujú na podinfo a nastavia mu veľkosť podľa kvóty
# namespace.
#
# Názvy kľúčov pochádzajú z values.yaml samotnej kostry — otvorte
# si ho vedľa a pozrite sa, ktoré gombíky existujú:
#
#     ~/hello-app/values.yaml
#
# Aplikujete cez:
#     helm install hello ~/hello-app -f ~/exercises/hello-app-values.yaml
#
# Docs: https://helm.sh/docs/chart_template_guide/values_files/
# =============================================================

replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  pullPolicy: IfNotPresent
  tag: "6.15.0"

# Service v kostre má predvolene port 80. Podinfo počúva na 9898,
# takže sa to musí posunúť.
#
# Všimnite si, že kostra šablónuje z tej istej hodnoty aj port
# CONTAINERA:
#
#     containerPort: {{ .Values.service.port }}
#
# Jedna hodnota, dve miesta. Overte si to sami v
# ~/hello-app/templates/deployment.yaml — predpoklad, že chart má
# samostatný gombík containerPort, je bežný spôsob, ako stratiť
# desať minút.
service:
  type: ClusterIP
  port: 9898

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

# Probes v kostre mieria na "/" — podinfo tam odpovedá, takže
# predvolené hodnoty fungujú bez zmeny.

ingress:
  enabled: false

autoscaling:
  enabled: false
