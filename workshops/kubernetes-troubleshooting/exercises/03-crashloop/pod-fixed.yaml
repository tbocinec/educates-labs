# =============================================================
# pod-fixed.yaml — ten istý worker, s namountovanou konfiguráciou
# =============================================================
# Pád v pod-crashloop.yaml nebol problém Kubernetes. Aplikácia
# naozaj potrebovala /etc/worker/config.yaml a nikto jej ho nedal.
#
# Tu konfigurácia žije v ConfigMape a je namountovaná ako súbor.
# Worker si ju nájde a ďalej beží.
#
# Poučenie: "CrashLoopBackOff" je príznak, nie príčina. Príčina
# bola v tom, čo si aplikácia sama zalogovala.
#
# Docs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
# =============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  config.yaml: |
    interval: 10s
    mode: production
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-fixed
  labels:
    app: worker-fixed
spec:
  containers:
  - name: worker
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo 'starting worker...'
      if [ ! -f /etc/worker/config.yaml ]; then
        echo 'FATAL: cannot open /etc/worker/config.yaml' >&2
        exit 1
      fi
      echo 'config loaded:'
      cat /etc/worker/config.yaml
      echo 'worker running, press Ctrl-C to stop'
      while true; do sleep 30; done
    volumeMounts:
    - name: config
      mountPath: /etc/worker
      readOnly: true
    resources:
      requests:
        memory: 32Mi
        cpu: 25m
      limits:
        memory: 64Mi
        cpu: 100m
  volumes:
  - name: config
    configMap:
      name: worker-config
