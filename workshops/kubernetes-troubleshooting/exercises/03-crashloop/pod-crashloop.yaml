# =============================================================
# pod-crashloop.yaml — worker, ktorý zomiera pri štarte
# =============================================================
# Tento container úspešne naštartuje, päť sekúnd beží, nenájde
# svoj konfiguračný súbor a skončí s kódom 1.
#
# Kubernetes ho reštartuje. Zlyhá znova. Po pár kolách je stav
# CrashLoopBackOff a odstup medzi reštartmi rastie
# (10 s, 20 s, 40 s ... až na 5 minút).
#
# Dôležité: použiteľný výstup patrí containeru, ktorý UŽ ZOMREL.
# Použite:
#
#     kubectl logs worker --previous
#
# Docs: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: worker
  labels:
    app: worker
spec:
  containers:
  - name: worker
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo 'starting worker...'
      sleep 5
      echo 'FATAL: cannot open /etc/worker/config.yaml' >&2
      exit 1
    resources:
      requests:
        memory: 32Mi
        cpu: 25m
      limits:
        memory: 64Mi
        cpu: 100m
