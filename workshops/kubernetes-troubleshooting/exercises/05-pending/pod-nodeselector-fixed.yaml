# =============================================================
# pod-nodeselector-fixed.yaml — nesplniteľná požiadavka odstránená
# =============================================================
# Ten istý Pod, bez nodeSelectora. Scheduler už má z čoho vyberať
# a umiestni ho okamžite.
#
# V produkcii by ste buď olabelovali nody, ktoré ten hardvér
# naozaj majú, alebo podmienku zrušili, ak nikdy neplatila.
#
# Docs: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: picky-app-fixed
  labels:
    app: picky-app-fixed
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
