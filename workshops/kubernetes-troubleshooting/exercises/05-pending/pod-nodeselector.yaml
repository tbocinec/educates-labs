# =============================================================
# pod-nodeselector.yaml — Pod, ktorému nevyhovie žiadny node
# =============================================================
# Scheduler hľadá node s labelom disktype=ultra-fast-ssd. Taký
# neexistuje, takže Pod ostane navždy v Pending.
#
# Všimnite si, čo sa NESTANE: žiadna chyba, žiadne varovanie pri
# apply, žiadne reštarty. Objekt je úplne platný. Len nikdy
# nenaštartuje.
#
# Scheduler sa vysvetlí v udalostiach Podu:
#
#     kubectl describe pod picky-app | grep -A8 Events:
#
# Docs: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: picky-app
  labels:
    app: picky-app
spec:
  # <-- Žiadny node v tomto klastri tento label nemá.
  nodeSelector:
    disktype: ultra-fast-ssd
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
