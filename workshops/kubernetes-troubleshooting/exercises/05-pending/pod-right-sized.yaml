# =============================================================
# pod-right-sized.yaml — požiadavka, ktorú namespace prijme
# =============================================================
# Ten istý workload, ale pýta si to, čo naozaj potrebuje.
# Admission ho pustí a scheduler ho umiestni.
#
# Po aplikovaní sledujte, ako sa zmení spotreba kvóty:
#
#     kubectl get resourcequota -o custom-columns=\
#       NAME:.metadata.name,USED:.status.used,HARD:.status.hard
#
# Docs: https://kubernetes.io/docs/concepts/policy/resource-quotas/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: greedy-app-fixed
  labels:
    app: greedy-app-fixed
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
