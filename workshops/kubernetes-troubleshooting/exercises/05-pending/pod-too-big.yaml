# =============================================================
# pod-too-big.yaml — odmietnutý skôr, než vznikol
# =============================================================
# Z tohto sa Pod vôbec nestane. "kubectl apply" vráti chybu a nič
# nevznikne.
#
# Váš namespace má LimitRange obmedzujúci jeden Pod na 8Gi pamäte
# a ResourceQuota obmedzujúcu súčet za celý namespace. Tento
# manifest si pýta 32Gi, takže ho admission rovno odmietne.
#
# Poučenie: keď apply vypísal chybu, nehľadajte Pod na popísanie.
# Text chyby JE tou diagnózou.
#
# Pravidlá si pozriete cez:
#     kubectl describe limitrange
#     kubectl describe resourcequota
#
# Docs: https://kubernetes.io/docs/concepts/policy/limit-range/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: greedy-app
  labels:
    app: greedy-app
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        memory: 16Gi
        cpu: 1
      limits:
        # <-- Ďaleko nad tým, čo tento namespace dovoľuje.
        memory: 32Gi
        cpu: 2
