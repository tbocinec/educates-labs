# =============================================================
# pod-bad-key.yaml — Pod, ktorý padne na konfigurácii
# =============================================================
# Image sa stiahne v poriadku. ConfigMap existuje. A Pod aj tak
# nikdy nenaštartuje, so stavom CreateContainerConfigError.
#
# Kubelet rozlišuje každý odkaz na ConfigMap a Secret EŠTE PRED
# spustením containera. Keď kľúč chýba, nie je čo spustiť — a teda
# ani žiadne logy na čítanie.
#
# VAŠA OPRAVA: ConfigMap definuje "app_mode", nie "mode".
#
# Docs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: config-app
  labels:
    app: config-app
spec:
  containers:
  - name: app
    image: nginx:1.27
    env:
    - name: APP_MODE
      valueFrom:
        configMapKeyRef:
          name: app-settings
          # <-- Zlý kľúč. ConfigMap obsahuje "app_mode".
          key: mode
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
