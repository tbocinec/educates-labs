# =============================================================
# configmap.yaml — nastavenia, ktoré má aplikácia čítať
# =============================================================
# Všimnite si názov kľúča: je to "app_mode", s podčiarkovníkom.
# Pod v pod-bad-key.yaml si však pýta "mode".
#
# Kubernetes nič neuhádne, nenormalizuje ani nenahrádza — odkaz
# na kľúč buď sedí presne, alebo container nikdy nenaštartuje.
#
# Docs: https://kubernetes.io/docs/concepts/configuration/configmap/
# =============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  app_mode: production
  log_level: info
