# =============================================================
# web-service-broken.yaml — Service, ktorá nevyberie nič
# =============================================================
# Pody majú label app=web. Táto Service hľadá app=webapp. Jedno
# písmeno a Service nemá žiadny backend.
#
# Kubernetes vás nevaruje. Prázdny výber je legitímny stav — Pody
# možno ešte nevznikli. Takže Service tam len tak sedí, prijíma
# spojenia a smeruje ich do prázdna.
#
# Jediný príkaz, ktorý to odhalí:
#
#     kubectl get endpoints web-service
#
# VAŠA OPRAVA: nižšie zmeňte "webapp" na "web".
#
# Docs: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
# =============================================================

apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: ClusterIP
  selector:
    # <-- Zle. Pody nesú app=web.
    app: webapp
  ports:
  - port: 80
    targetPort: 80
