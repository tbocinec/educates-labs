# =============================================================
# web-service-badport.yaml — správne Pody, zlé dvere
# =============================================================
# Táto Service vyberá správne (app=web), takže "kubectl get
# endpoints" ukáže dve IP Podov a všetko vyzerá prepojené.
#
# Prevádzka aj tak zlyháva, lebo targetPort mieri na 8080, kým
# nginx počúva na 80.
#
#   port       = na čo volajú klienti Service
#   targetPort = port containera, kam sa prevádzka preposiela
#
# Smú sa líšiť, a práve preto sa táto chyba robí ľahko a vo výpise
# Podov ju nevidno.
#
# Docs: https://kubernetes.io/docs/concepts/services-networking/service/
# =============================================================

apiVersion: v1
kind: Service
metadata:
  name: web-badport
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    # <-- Na porte 8080 vnútri containera nič nepočúva.
    targetPort: 8080
