# =============================================================
# web-deployment.yaml — úplne zdravá aplikácia
# =============================================================
# Na tomto súbore nie je nič zlé. Obe repliky nabehnú, ostanú
# pripravené a nikdy sa nereštartujú.
#
# Je tu preto, aby ste videli, že dokonale vyzerajúci "kubectl get
# pods" nehovorí NIČ o tom, či Service pred ním funguje.
#
# Všimnite si label, ktorý Pody nesú: app=web. Zapamätajte si ho,
# keď budete čítať web-service-broken.yaml.
#
# Docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        # <-- Container počúva na porte 80. Toto si tiež zapamätajte.
        - containerPort: 80
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
