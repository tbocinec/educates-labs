# =============================================================
# pod-bad-image.yaml — Pod, ktorý nikdy nenaštartuje
# =============================================================
# Niekto vám podal tento manifest. Vyzerá úplne rozumne a
# Kubernetes ho bez námietok prijme.
#
# Pod bude navždy visieť v ImagePullBackOff, lebo tag image
# uvedený nižšie v registry neexistuje.
#
# Pozor: BackOff znamená "skúšam znova s narastajúcimi odstupmi",
# nie "vzdal som to". Preklep tu potichu blokuje miesto celý deň.
#
# Docs: https://kubernetes.io/docs/concepts/containers/images/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: web-server
  labels:
    app: web-server
spec:
  containers:
  - name: nginx
    # <-- Tento tag neexistuje. nginx vydáva 1.27, nie 1.99.
    image: nginx:1.99-does-not-exist
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
