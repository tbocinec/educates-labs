# =============================================================
# pod-oom-fixed.yaml — tá istá práca, s poctivým limitom
# =============================================================
# Workload naozaj potrebuje asi 200 MB, takže chybou bol limit —
# nie aplikácia.
#
# V praxi s týmto záverom opatrne. Ak aplikácii UNIKÁ pamäť, väčší
# limit len oddiali pád. Najprv si pozrite reálnu spotrebu:
#
#     kubectl top pod            (treba metrics-server)
#
# Docs: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: memory-hog-fixed
  labels:
    app: memory-hog-fixed
spec:
  restartPolicy: Never
  containers:
  - name: hog
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo 'filling memory...'
      dd if=/dev/zero of=/cache/fill bs=1M count=200
      echo 'done'
    volumeMounts:
    - name: cache
      mountPath: /cache
    resources:
      requests:
        memory: 256Mi
        cpu: 50m
      limits:
        # <-- priestor na 200 MB plus réžia.
        memory: 320Mi
        cpu: 200m
  volumes:
  - name: cache
    emptyDir:
      medium: Memory
      sizeLimit: 256Mi
