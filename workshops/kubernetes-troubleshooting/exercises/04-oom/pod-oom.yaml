# =============================================================
# pod-oom.yaml — container, ktorý prekročí svoj limit pamäte
# =============================================================
# Zapisuje 200 MB do volume v pamäti (tmpfs), pričom má limit
# pamäte 64 Mi. Súbory zapísané do emptyDir s "medium: Memory" sa
# počítajú do pamäte containera, takže zasiahne OOM killer jadra.
#
# Čo uvidíte:
#   - reason:        OOMKilled
#   - návratový kód: 137   (128 + SIGKILL)
#   - logy:          PRÁZDNE
#
# To posledné je ten odtlačok prsta. Proces bol zabitý okamžite a
# nemal šancu čokoľvek zalogovať.
#
# Docs: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  labels:
    app: memory-hog
spec:
  restartPolicy: Never
  containers:
  - name: hog
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo 'filling memory...'
      dd if=/dev/zero of=/cache/fill bs=1M count=200
      echo 'done'
    volumeMounts:
    - name: cache
      mountPath: /cache
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        # <-- 64 Mi, pričom príkaz zapisuje 200 MB.
        memory: 64Mi
        cpu: 200m
  volumes:
  - name: cache
    emptyDir:
      medium: Memory
