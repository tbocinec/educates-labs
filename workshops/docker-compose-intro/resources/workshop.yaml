apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "docker-compose-intro"
spec:
  title: "Introduction to Docker Compose"
  description: "A hands-on workshop covering Docker Compose fundamentals — defining multi-container applications in YAML, managing service lifecycle, networking between services, environment configuration, volumes, and essential Compose CLI commands."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/docker-compose-intro-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/docker-compose-intro-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: x-large
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 4Gi
      registry:
        enabled: true
      vcluster:
        enabled: false
    ingresses:
    - name: web
      port: 8080
    dashboards:
    - name: Web App
      url: "$(ingress_protocol)://$(session_namespace)-web.$(ingress_domain)"
