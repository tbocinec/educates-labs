apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "docker-compose-intro"
spec:
  title: "Úvod do Docker Compose"
  description: "Praktický workshop pokrývajúci základy Docker Compose — definovanie viackontajnerových aplikácií v YAML, správu životného cyklu services, networking medzi services, konfiguráciu environment, volumes a základné Compose CLI príkazy."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/docker-compose-intro-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/docker-compose-intro-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: large
    resources:
      memory: 1536Mi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 3Gi
      registry:
        enabled: false
      vcluster:
        enabled: false
    ingresses:
    - name: web
      port: 8080
    dashboards:
    - name: Web App
      url: "$(ingress_protocol)://$(session_namespace)-web.$(ingress_domain)"
