services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"

  cache:
    image: redis:7

  debug:
    image: alpine:latest
    command: sh -c 'echo "Debug tools container ready" && sleep 3600'
    profiles:
      - debug

  monitoring:
    image: alpine:latest
    command: sh -c 'echo "Monitoring agent started" && sleep 3600'
    profiles:
      - monitoring
