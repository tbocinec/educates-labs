# =============================================================
# secret.yaml — Secret definovaný v YAML
# =============================================================
# Secrets uchovávajú citlivé údaje ako heslá, tokeny a kľúče.
# V poli 'data' MUSIA byť hodnoty kódované cez base64.
# Alternatívne použite 'stringData' pre čistý text (Kubernetes
# ho zakóduje sám).
#
# Docs: https://kubernetes.io/docs/concepts/configuration/secret/
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_HOST: "db.example.com"
  DB_USER: "admin"
  DB_PASSWORD: "s3cur3P@ssw0rd!"
