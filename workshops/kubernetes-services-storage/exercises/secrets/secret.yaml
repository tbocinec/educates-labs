# =============================================================
# secret.yaml — A Secret defined in YAML
# =============================================================
# Secrets store sensitive data such as passwords, tokens, and keys.
# Values MUST be base64-encoded in the 'data' field.
# Alternatively, use 'stringData' for plain-text values (K8s
# encodes them automatically).
#
# Docs: https://kubernetes.io/docs/concepts/configuration/secret/
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_HOST: "db.example.com"
  DB_USER: "admin"
  DB_PASSWORD: "s3cur3P@ssw0rd!"
