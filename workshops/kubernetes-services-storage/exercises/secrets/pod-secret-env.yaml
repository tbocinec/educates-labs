# =============================================================
# pod-secret-env.yaml — Pod konzumujúci Secret ako env vars
# =============================================================
# Tento Pod načíta cez envFrom všetky dvojice kľúč-hodnota zo
# Secretu 'db-credentials' ako premenné prostredia.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  labels:
    app: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo DB_HOST=$DB_HOST; echo DB_USER=$DB_USER; echo DB_PASSWORD=$DB_PASSWORD; sleep 3600"]
    envFrom:
    - secretRef:
        name: db-credentials
  restartPolicy: Never
