# =============================================================
# pod-secret-env.yaml — Pod consuming a Secret as env vars
# =============================================================
# This Pod loads all key-value pairs from the 'db-credentials'
# Secret as environment variables using envFrom.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: secret-env-demo
  labels:
    app: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo DB_HOST=$DB_HOST; echo DB_USER=$DB_USER; echo DB_PASSWORD=$DB_PASSWORD; sleep 3600"]
    envFrom:
    - secretRef:
        name: db-credentials
  restartPolicy: Never
