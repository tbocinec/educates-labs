# =============================================================
# pod-secret-volume.yaml — Pod mounting a Secret as files
# =============================================================
# This Pod mounts the 'db-credentials' Secret as files inside
# the container at /etc/secrets/. Each key becomes a filename,
# and the value is the file content.
#
# This is useful for TLS certs, SSH keys, or config files
# that applications read from disk.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-demo
  labels:
    app: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo '--- Files in /etc/secrets/ ---'; ls -la /etc/secrets/; echo; echo '--- DB_PASSWORD content ---'; cat /etc/secrets/DB_PASSWORD; echo; sleep 3600"]
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: db-credentials
  restartPolicy: Never
