# =============================================================
# pod-secret-volume.yaml — Pod mountujúci Secret ako súbory
# =============================================================
# Tento Pod mountuje Secret 'db-credentials' ako súbory vnútri
# containera do /etc/secrets/. Z každého kľúča sa stane názov
# súboru a hodnota je jeho obsahom.
#
# Hodí sa to na TLS certifikáty, SSH kľúče alebo konfiguračné
# súbory, ktoré aplikácie čítajú z disku.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
  labels:
    app: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo '--- Files in /etc/secrets/ ---'; ls -la /etc/secrets/; echo; echo '--- DB_PASSWORD content ---'; cat /etc/secrets/DB_PASSWORD; echo; sleep 3600"]
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: db-credentials
  restartPolicy: Never
