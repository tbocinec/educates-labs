# =============================================================
# pod-multi-label.yaml — viac Podov s rôznymi labelmi
# =============================================================
# Tieto Pody ukazujú, ako labels umožňujú filtrovanie a výber
# konkrétnych zdrojov cez kubectl.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: frontend-v1
  labels:
    app: web
    tier: frontend
    version: "1.0"
spec:
  containers:
  - name: nginx
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-v2
  labels:
    app: web
    tier: frontend
    version: "2.0"
spec:
  containers:
  - name: nginx
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-v1
  labels:
    app: api
    tier: backend
    version: "1.0"
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Backend API running'; sleep 3600"]
