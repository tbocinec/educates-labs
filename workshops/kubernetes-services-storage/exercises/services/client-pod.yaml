# =============================================================
# client-pod.yaml — klientský Pod na testovanie spojenia
# =============================================================
# Tento odľahčený busybox Pod stále beží, takže sa doň viete
# dostať cez exec a otestovať sieťové spojenie na Services
# pomocou curl/wget.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
