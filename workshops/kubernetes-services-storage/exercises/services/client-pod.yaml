# =============================================================
# client-pod.yaml — A client Pod for testing Service connectivity
# =============================================================
# This lightweight busybox Pod stays running so you can exec into
# it and test network connectivity to Services using curl/wget.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
