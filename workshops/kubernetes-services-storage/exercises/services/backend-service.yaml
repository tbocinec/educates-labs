# =============================================================
# backend-service.yaml — ClusterIP Service pre backend
# =============================================================
# Service poskytuje stabilnú IP adresu a DNS názov pre sadu
# Podov vybraných podľa labelov. ClusterIP je predvolený typ —
# Service je dostupná len v rámci klastra.
#
# Ostatné Pody sa na ňu dostanú cez:
#   - http://backend-svc:9898          (rovnaký namespace)
#   - http://backend-svc.<ns>.svc.cluster.local:9898  (iný namespace)
#
# Docs: https://kubernetes.io/docs/concepts/services-networking/service/
# =============================================================

apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 9898
    targetPort: 9898
