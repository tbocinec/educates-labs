# =============================================================
# backend-deployment.yaml — backend, ktorý vracia svoj hostname
# =============================================================
# Tento Deployment vytvorí jednoduchý HTTP server postavený na
# hashicorp/http-echo. Každý Pod odpovedá vlastným názvom, takže
# pri prístupe cez Service je rozklad záťaže pekne vidieť.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=Hello from backend"
        - "-listen=:5678"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
