# =============================================================
# backend-deployment.yaml — backend, ktorý vracia svoj hostname
# =============================================================
# Tento Deployment spustí tri repliky aplikácie podinfo. Na
# endpointe /api/info každá vráti okrem iného svoj "hostname",
# čo je názov Podu, ktorý požiadavku obslúžil.
#
# Práve vďaka tomu uvidíte rozklad záťaže: keď rovnakú požiadavku
# pošlete cez Service viackrát, hostname sa bude meniť.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.15.0
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
