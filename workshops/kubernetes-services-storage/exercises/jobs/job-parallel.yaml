# =============================================================
# job-parallel.yaml — Job s paralelným vykonávaním
# =============================================================
# Tento Job potrebuje 4 dokončenia, pričom naraz bežia najviac
# 2 Pody. Každý Pod simuluje jednu pracovnú položku.
#
# completions: celkový počet úspešných Podov
# parallelism: maximálny počet Podov bežiacich naraz
# =============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-worker
spec:
  completions: 4
  parallelism: 2
  template:
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo \"Worker $(hostname) starting...\"; sleep 5; echo \"Worker $(hostname) done!\""]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      restartPolicy: Never
  backoffLimit: 2
