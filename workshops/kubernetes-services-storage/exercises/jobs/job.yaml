# =============================================================
# job.yaml — jednoduchý Job v Kubernetes
# =============================================================
# Job vytvorí jeden alebo viac Podov a dohliadne na to, aby sa
# určený počet z nich úspešne dokončil. Potom je Job hotový.
#
# Použitie: migrácie databáz, dávkové spracovanie, generovanie
# reportov.
#
# Docs: https://kubernetes.io/docs/concepts/workloads/controllers/job/
# =============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: pi-calculator
spec:
  template:
    spec:
      containers:
      - name: pi
        image: perl:5.38-slim
        command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(200)"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      restartPolicy: Never
  backoffLimit: 3
