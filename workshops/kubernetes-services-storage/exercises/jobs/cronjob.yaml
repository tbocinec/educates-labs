# =============================================================
# cronjob.yaml — CronJob spúšťaný podľa plánu
# =============================================================
# CronJob vytvára Jobs podľa časového plánu (cron syntax).
# Tento príklad beží každú minútu a vypíše aktuálny čas.
#
# Cron formát: "minúta hodina deň-v-mesiaci mesiac deň-v-týždni"
#   */1 * * * * = každú minútu
#   0 */6 * * * = každých 6 hodín
#   0 0 * * 1   = každý pondelok o polnoci
#
# Docs: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
# =============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: time-reporter
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: reporter
            image: busybox:1.36
            command: ["sh", "-c", "echo \"Report generated at $(date)\""]
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
          restartPolicy: Never
