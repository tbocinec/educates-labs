# =============================================================
# pvc.yaml — PersistentVolumeClaim žiadajúci úložisko
# =============================================================
# PVC je požiadavka o úložisko. Kubernetes dynamicky vytvorí
# PersistentVolume (PV), ktorý tejto požiadavke vyhovie.
#
# Kľúčové polia:
#   - accessModes: ReadWriteOnce = čítanie/zápis z jedného nodu
#   - resources.requests.storage: koľko úložiska žiadame
#
# Docs: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
# =============================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
