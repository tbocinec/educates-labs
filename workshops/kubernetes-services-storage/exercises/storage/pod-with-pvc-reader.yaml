# =============================================================
# pod-with-pvc-reader.yaml — druhý Pod čítajúci z toho istého PVC
# =============================================================
# Tento Pod mountuje to isté PVC a číta dáta zapísané
# predchádzajúcim Podom. Dokazuje, že dáta pretrvávajú nezávisle
# od Podu.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: storage-reader
  labels:
    app: storage-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo '--- Reading persisted data from /data/log.txt ---'; cat /data/log.txt; sleep 3600"]
    volumeMounts:
    - name: data-volume
      mountPath: /data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: my-data
  restartPolicy: Never
