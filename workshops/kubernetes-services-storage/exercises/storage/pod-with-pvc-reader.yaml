# =============================================================
# pod-with-pvc-reader.yaml — Second Pod reading from the same PVC
# =============================================================
# This Pod mounts the same PVC and reads the data written
# by the previous Pod, proving the data persists independently.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: storage-reader
  labels:
    app: storage-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo '--- Reading persisted data from /data/log.txt ---'; cat /data/log.txt; sleep 3600"]
    volumeMounts:
    - name: data-volume
      mountPath: /data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: my-data
  restartPolicy: Never
