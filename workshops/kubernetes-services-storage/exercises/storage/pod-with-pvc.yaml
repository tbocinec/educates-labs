# =============================================================
# pod-with-pvc.yaml — Pod mountujúci PersistentVolumeClaim
# =============================================================
# Tento Pod zapisuje dáta do /data (podložené cez PVC).
# Keď Pod zmažete a vytvoríte nanovo, dáta ostanú, lebo sú
# uložené na PersistentVolume, nie v containeri.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: storage-writer
  labels:
    app: storage-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Writing data...'; date >> /data/log.txt; echo 'Current log:'; cat /data/log.txt; sleep 3600"]
    volumeMounts:
    - name: data-volume
      mountPath: /data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: my-data
  restartPolicy: Never
