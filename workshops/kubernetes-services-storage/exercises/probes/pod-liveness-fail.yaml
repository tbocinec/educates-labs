# =============================================================
# pod-liveness-fail.yaml — Pod so zlyhávajúcou liveness probe
# =============================================================
# Tento Pod naštartuje zdravý, ale po 15 sekundách sa stane
# nezdravým (zmaže sa súbor /tmp/healthy). Liveness probe tento
# súbor kontroluje — keď zmizne, probe zlyhá a Kubernetes
# container reštartuje.
#
# Ukazuje to automatický self-healing cez liveness probes.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: liveness-fail-demo
  labels:
    app: liveness-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "Starting up — creating health file..."
      touch /tmp/healthy
      echo "App is healthy. Will become unhealthy in 15s..."
      sleep 15
      echo "Removing health file — app is now unhealthy!"
      rm -f /tmp/healthy
      echo "Waiting for Kubernetes to detect and restart..."
      sleep 600
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2
  restartPolicy: Always
