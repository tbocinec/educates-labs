# =============================================================
# pod-probes.yaml — Pod with liveness and readiness probes
# =============================================================
# Probes let Kubernetes monitor your application's health:
#
#   - Liveness probe: "Is the container still alive?"
#     If it fails → Kubernetes restarts the container.
#
#   - Readiness probe: "Is the container ready to serve traffic?"
#     If it fails → Kubernetes removes the Pod from Service endpoints.
#
# This Pod runs Nginx with both probes configured.
#
# Docs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: healthy-app
  labels:
    app: healthy-app
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 3
      periodSeconds: 5
