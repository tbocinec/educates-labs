# =============================================================
# pod-probes.yaml — Pod s liveness a readiness probe
# =============================================================
# Probes umožňujú Kubernetes sledovať zdravie vašej aplikácie:
#
#   - Liveness probe: "Žije container ešte?"
#     Pri zlyhaní → Kubernetes container reštartuje.
#
#   - Readiness probe: "Je container pripravený obsluhovať?"
#     Pri zlyhaní → Kubernetes ho vyradí z endpointov Service.
#
# Tento Pod beží na Nginxe a má nastavené obe probes.
#
# Docs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: healthy-app
  labels:
    app: healthy-app
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 3
      periodSeconds: 5
