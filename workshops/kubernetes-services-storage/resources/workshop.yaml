apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "kubernetes-services-storage"
spec:
  title: "Kubernetes: Services, Secrets a úložisko"
  description: "Nadväzujúci workshop o labeloch a selektoroch do hĺbky, namespaces, sieťovaní Podov a Services, práci s citlivými údajmi cez Secrets, trvalom úložisku cez PVC, kontrolách zdravia cez probes a dávkových úlohách cez Jobs a CronJobs."
  url: https://github.com/tbocinec/educates-labs
  difficulty: beginner
  duration: 105m
  publish:
    image: "$(image_repository)/kubernetes-services-storage-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/kubernetes-services-storage-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: x-large
      security:
        policy: baseline
    resources:
      memory: 1Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: true
      docker:
        enabled: false
      registry:
        enabled: false
      vcluster:
        enabled: false
    objects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: $(session_name)-cluster-reader
      rules:
      - apiGroups: [""]
        resources: ["nodes", "namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["services"]
        verbs: ["get", "list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: $(session_name)-cluster-reader
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: $(session_name)-cluster-reader
      subjects:
      - kind: ServiceAccount
        namespace: $(workshop_namespace)
        name: $(service_account)
