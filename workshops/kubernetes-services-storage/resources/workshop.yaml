apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "kubernetes-services-storage"
spec:
  title: "Kubernetes: Services, Secrets a úložisko"
  description: "Nadväzujúci workshop o labeloch a selektoroch do hĺbky, namespaces, sieťovaní Podov a Services, práci s citlivými údajmi cez Secrets, trvalom úložisku cez PVC, kontrolách zdravia cez probes a dávkových úlohách cez Jobs a CronJobs."
  url: https://github.com/tbocinec/educates-labs
  difficulty: beginner
  duration: 105m
  publish:
    image: "$(image_repository)/kubernetes-services-storage-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/kubernetes-services-storage-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: x-large
      security:
        policy: baseline
    resources:
      memory: 1Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        # Nahradený Headlampom (pozri ingress/dashboard/objects nižšie) — je to
        # lepšie UI a nepotrebuje prihlásenie tokenom.
        enabled: false
      docker:
        enabled: false
      registry:
        enabled: false
      vcluster:
        enabled: false
    ingresses:
    - name: headlamp
      host: headlamp.$(session_namespace).svc.$(cluster_domain)
      port: 4466
    dashboards:
    - name: Headlamp
      url: "$(ingress_protocol)://$(session_namespace)-headlamp.$(ingress_domain)"
    objects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: $(session_name)-cluster-reader
      rules:
      - apiGroups: [""]
        resources: ["nodes", "namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["services"]
        verbs: ["get", "list"]
      # Modul o úložisku vypisuje PersistentVolumes a StorageClasses — oboje je
      # cluster-scoped, takže bez tohto vráti kubectl "Forbidden".
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["storageclasses"]
        verbs: ["get", "list", "watch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: $(session_name)-cluster-reader
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: $(session_name)-cluster-reader
      subjects:
      - kind: ServiceAccount
        namespace: $(workshop_namespace)
        name: $(service_account)

    # --- Headlamp: in-session Kubernetes UI, replaces the built-in console ---
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: headlamp
    # Nodes only — deliberately NOT "namespaces". Headlamp preselects the
    # namespace from the kubeconfig only when listing namespaces fails, which is
    # what makes the session land on its own namespace instead of "All
    # namespaces". See useDefaultNamespaceFallback in Headlamp's frontend.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: $(session_name)-headlamp-nodes
      rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: $(session_name)-headlamp-nodes
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: $(session_name)-headlamp-nodes
      subjects:
      - kind: ServiceAccount
        namespace: $(session_namespace)
        name: headlamp
    # Kubeconfig whose context pins the session namespace. Headlamp reads that
    # as the cluster's default namespace; -in-cluster alone cannot carry one.
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: headlamp-kubeconfig
      data:
        config: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: workshop
            cluster:
              server: https://kubernetes.default.svc
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          users:
          - name: headlamp
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          contexts:
          - name: workshop
            context:
              cluster: workshop
              user: headlamp
              namespace: $(session_namespace)
          current-context: workshop
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: headlamp
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
      - kind: ServiceAccount
        namespace: $(session_namespace)
        name: headlamp
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: headlamp
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: headlamp
        template:
          metadata:
            labels:
              app: headlamp
          spec:
            serviceAccountName: headlamp
            containers:
            - name: headlamp
              image: ghcr.io/headlamp-k8s/headlamp:v0.45.0
              args:
              # The kubeconfig carries the credentials (tokenFile) as well as the
              # namespace, so the learner is never shown a token login prompt and
              # no --unsafe-use-service-account-token flag is needed.
              - "-kubeconfig"
              - "/headlamp/kubeconfig/config"
              volumeMounts:
              - name: kubeconfig
                mountPath: /headlamp/kubeconfig
                readOnly: true
              ports:
              - name: http
                containerPort: 4466
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 500m
              readinessProbe:
                httpGet:
                  path: /
                  port: 4466
                initialDelaySeconds: 5
                periodSeconds: 5
            volumes:
            - name: kubeconfig
              configMap:
                name: headlamp-kubeconfig
    - apiVersion: v1
      kind: Service
      metadata:
        name: headlamp
      spec:
        selector:
          app: headlamp
        ports:
        - port: 4466
          targetPort: 4466
