apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "dockerfile-intro"
spec:
  title: "Vytváranie Docker images pomocou Dockerfile"
  description: "Praktický workshop o základoch Dockerfile — písanie Dockerfile, pochopenie vrstiev (layers) image a cachingu, kľúčové inštrukcie, osvedčené postupy a multi-stage builds pre images pripravené do produkcie."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/dockerfile-intro-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/dockerfile-intro-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: large
    resources:
      memory: 1536Mi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 2Gi
      registry:
        enabled: false
      vcluster:
        enabled: false
    ingresses:
    - name: app
      port: 8080
    dashboards:
    - name: App Preview
      url: "$(ingress_protocol)://$(session_namespace)-app.$(ingress_domain)"
