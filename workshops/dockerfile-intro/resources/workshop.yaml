apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "dockerfile-intro"
spec:
  title: "Building Docker Images with Dockerfiles"
  description: "A hands-on workshop covering Dockerfile fundamentals — writing Dockerfiles, understanding image layers and caching, key instructions, best practices, and multi-stage builds for production-ready images."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/dockerfile-intro-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/dockerfile-intro-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md

  session:
    namespaces:
      budget: x-large
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 4Gi
      registry:
        enabled: true
      vcluster:
        enabled: false
    ingresses:
    - name: app
      port: 8080
    dashboards:
    - name: App Preview
      url: "$(ingress_protocol)://$(session_namespace)-app.$(ingress_domain)"
