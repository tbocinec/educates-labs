apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "docker-networking-storage"
spec:
  title: "Docker: Sieťovanie, porty a úložisko"
  description: "Pokročilý praktický workshop pokrývajúci mapovanie portov v Dockeri, volumes, perzistentné dáta, bind mounts, docker cp a sieťovanie kontajnerov — vrátane používateľom definovaných bridge sietí, DNS rozlíšenia, izolácie sietí a host networkingu."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/docker-networking-storage-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/docker-networking-storage-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /README.md
      
  session:
    namespaces:
      budget: large
    resources:
      memory: 1536Mi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 2Gi
      registry:
        enabled: false
      vcluster:
        enabled: false
    ingresses:
    - name: nginx
      port: 8080
    dashboards:
    - name: Nginx
      url: "$(ingress_protocol)://$(session_namespace)-nginx.$(ingress_domain)"
