apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "docker-networking-storage"
spec:
  title: "Docker: Networking, Ports & Storage"
  description: "An intermediate hands-on workshop covering Docker port mapping, volumes, persistent data, bind mounts, docker cp, and container networking — including user-defined bridge networks, DNS resolution, network isolation, and host networking."
  url: https://github.com/tbocinec/educates-labs
  publish:
    image: "$(image_repository)/docker-networking-storage-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /README.md

  workshop:
    image: "ghcr.io/educates/educates-jdk21-environment:latest"
    files:
    - image:
        url: "$(image_repository)/docker-networking-storage-files:$(workshop_version)"
      includePaths:
      - /workshop/**
      - /README.md
      
  session:
    namespaces:
      budget: x-large
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: true
        memory: 3Gi
      registry:
        enabled: true
      vcluster:
        enabled: false
    ingresses:
    - name: nginx
      port: 8080
    dashboards:
    - name: Nginx
      url: "$(ingress_protocol)://$(session_namespace)-nginx.$(ingress_domain)"
