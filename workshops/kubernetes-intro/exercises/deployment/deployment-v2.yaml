# =============================================================
# deployment-v2.yaml — Updated Deployment (image version bump)
# =============================================================
# This is the same Deployment with the image updated to nginx:1.27.
# Applying this will trigger a rolling update — Kubernetes will
# gradually replace old Pods with new ones, ensuring zero downtime.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
