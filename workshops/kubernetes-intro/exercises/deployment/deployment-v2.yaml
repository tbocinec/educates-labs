# =============================================================
# deployment-v2.yaml — aktualizovaný Deployment (zmena verzie image)
# =============================================================
# Ten istý Deployment, len s image zmeneným na nginx:1.27.
# Jeho aplikovaním sa spustí rolling update — Kubernetes postupne
# nahradí staré Pody novými, bez výpadku.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
