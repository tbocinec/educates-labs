# =============================================================
# pod-labels.yaml — Pod s ukážkou labelov a anotácií
# =============================================================
# Labels sú dvojice kľúč-hodnota na organizáciu a výber zdrojov.
# Annotations držia metadáta, podľa ktorých sa nevyberá
# (dokumentácia, kontakty a podobne).
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: labeled-app
  labels:
    app: web
    environment: development
    team: frontend
    version: "1.0"
  annotations:
    description: "A demo pod showing labels and annotations"
    owner: "workshop-user"
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
