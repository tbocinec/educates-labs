# =============================================================
# pod.yaml — jednoduchý Pod s Nginxom
# =============================================================
# Pod je najmenšia nasaditeľná jednotka v Kubernetes.
# Tento manifest definuje jeden Pod s jedným Nginx containerom.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: my-nginx
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
