# =============================================================
# pod-configmap-volume.yaml — Pod mountujúci ConfigMap ako volume
# =============================================================
# Tento Pod mountuje ConfigMapu 'file-config' ako súbory vnútri
# containera do /etc/config/. Z každého kľúča v ConfigMape sa
# stane súbor a jeho hodnota bude obsahom toho súboru.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: configmap-volume-demo
  labels:
    app: configmap-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo '--- Contents of /etc/config/ ---'; ls /etc/config/; echo '--- app-config.properties ---'; cat /etc/config/app-config.properties; sleep 3600"]
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
  - name: config-volume
    configMap:
      name: file-config
  restartPolicy: Never
