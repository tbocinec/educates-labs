# =============================================================
# configmap.yaml — ConfigMap definovaná v YAML
# =============================================================
# ConfigMap uchováva necitlivú konfiguráciu ako dvojice
# kľúč-hodnota. Pody ju vedia konzumovať ako:
#   - premenné prostredia
#   - argumenty príkazového riadku
#   - konfiguračné súbory v namountovanom volume
# =============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_COLOR: "blue"
  APP_MODE: "production"
  LOG_LEVEL: "INFO"
