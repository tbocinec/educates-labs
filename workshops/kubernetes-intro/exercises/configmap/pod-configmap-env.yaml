# =============================================================
# pod-configmap-env.yaml — Pod consuming ConfigMap as env vars
# =============================================================
# This Pod references the 'app-config' ConfigMap and loads
# all its key-value pairs as environment variables using envFrom.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: configmap-env-demo
  labels:
    app: configmap-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo APP_COLOR=$APP_COLOR; echo APP_MODE=$APP_MODE; echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
    envFrom:
    - configMapRef:
        name: app-config
  restartPolicy: Never
