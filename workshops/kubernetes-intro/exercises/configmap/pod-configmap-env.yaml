# =============================================================
# pod-configmap-env.yaml — Pod konzumujúci ConfigMap ako env vars
# =============================================================
# Tento Pod odkazuje na ConfigMapu 'app-config' a cez envFrom
# načíta všetky jej dvojice kľúč-hodnota ako premenné prostredia.
# =============================================================

apiVersion: v1
kind: Pod
metadata:
  name: configmap-env-demo
  labels:
    app: configmap-demo
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "echo APP_COLOR=$APP_COLOR; echo APP_MODE=$APP_MODE; echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
    envFrom:
    - configMapRef:
        name: app-config
  restartPolicy: Never
